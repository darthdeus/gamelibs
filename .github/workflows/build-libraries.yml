name: Build Game Libraries

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      clear_cache:
        description: 'Clear build cache'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-ubuntu:
    runs-on: ubuntu-22.04
    name: Build Ubuntu x86_64

    steps:
    - uses: actions/checkout@v4

    - name: Generate cache keys
      id: cache-keys
      run: |
        # Cache version - increment this to force cache rebuild
        CACHE_VERSION="v1"

        # Add manual cache clear suffix if requested
        if [ "${{ github.event.inputs.clear_cache }}" = "true" ]; then
          CACHE_SUFFIX="-cleared-$(date +%s)"
        else
          CACHE_SUFFIX=""
        fi

        # Generate hash of SDL2 source for cache key
        SDL2_HASH=$(find SDL2-2.32.4 -type f -name '*.c' -o -name '*.h' -o -name 'CMakeLists.txt' | head -100 | xargs sha256sum | sha256sum | cut -d' ' -f1)
        echo "sdl2-hash=${CACHE_VERSION}-${SDL2_HASH}${CACHE_SUFFIX}" >> $GITHUB_OUTPUT

        # Generate hash of FreeType source for cache key
        FT_HASH=$(find freetype-2.14.1 -type f -name '*.c' -o -name '*.h' -o -name 'CMakeLists.txt' | head -100 | xargs sha256sum | sha256sum | cut -d' ' -f1)
        echo "freetype-hash=${CACHE_VERSION}-${FT_HASH}${CACHE_SUFFIX}" >> $GITHUB_OUTPUT

        # Generate hash of cimgui source for cache key
        CIMGUI_HASH=$(find cimgui imgui_backends -type f -name '*.cpp' -o -name '*.h' -o -name '*.py' 2>/dev/null | xargs sha256sum 2>/dev/null | sha256sum | cut -d' ' -f1)
        echo "cimgui-hash=${CACHE_VERSION}-${CIMGUI_HASH}${CACHE_SUFFIX}" >> $GITHUB_OUTPUT

        # Generate hash of LuaJIT source for cache key
        LUAJIT_HASH=$(find luajit -type f -name '*.c' -o -name '*.h' -o -name 'Makefile' | head -100 | xargs sha256sum | sha256sum | cut -d' ' -f1)
        echo "luajit-hash=${CACHE_VERSION}-${LUAJIT_HASH}${CACHE_SUFFIX}" >> $GITHUB_OUTPUT

        # Generate hash of SDL_image build script for cache key
        SDL_IMAGE_HASH=$(sha256sum build_sdl_image.py SDL2_image-2.8.2/CMakeLists.txt 2>/dev/null | sha256sum | cut -d' ' -f1)
        echo "sdl-image-hash=${CACHE_VERSION}-${SDL_IMAGE_HASH}${CACHE_SUFFIX}" >> $GITHUB_OUTPUT

        # Generate hash of SDL_mixer build script for cache key
        SDL_MIXER_HASH=$(sha256sum build_sdl_mixer.py SDL2_mixer-2.8.0/CMakeLists.txt 2>/dev/null | sha256sum | cut -d' ' -f1)
        echo "sdl-mixer-hash=${CACHE_VERSION}-${SDL_MIXER_HASH}${CACHE_SUFFIX}" >> $GITHUB_OUTPUT

        # Generate hash of SoLoud build script and source for cache key
        SOLOUD_HASH=$(find soloud-RELEASE_20200207 -type f -name '*.cpp' -o -name '*.c' -o -name '*.h' | head -100 | xargs sha256sum 2>/dev/null | sha256sum | cut -d' ' -f1)
        SOLOUD_SCRIPT_HASH=$(sha256sum build_soloud.py 2>/dev/null | cut -d' ' -f1)
        echo "soloud-hash=${CACHE_VERSION}-${SOLOUD_HASH}-${SOLOUD_SCRIPT_HASH}${CACHE_SUFFIX}" >> $GITHUB_OUTPUT

        # libmpv+FFmpeg: build_mpv.py embeds the pinned FFmpeg/mpv/
        # mpv-build refs, so hashing the script alone captures any pin
        # bump. ffmpeg+mpv compile is ~10-30min on a runner -- caching
        # the staged output is mandatory.
        # NB: git hash-object, NOT sha256sum -- sha256sum is Linux-only
        # (absent on macOS runners), which silently produced an empty
        # hash there => a constant cache key that never invalidated, so
        # macOS shipped a stale build for two releases. git is present
        # and deterministic on every runner.
        MPV_HASH=$(git hash-object build_mpv.py)
        echo "mpv-hash=${CACHE_VERSION}-${MPV_HASH}${CACHE_SUFFIX}" >> $GITHUB_OUTPUT

    - name: Cache SDL2 build
      id: cache-sdl2
      uses: actions/cache@v3
      with:
        path: |
          prebuilt/linux/x86_64/lib/libSDL2*
          prebuilt/linux/x86_64/include/SDL2
          prebuilt/linux/x86_64/lib/pkgconfig/sdl2.pc
          prebuilt/linux/x86_64/bin/sdl2-config
        key: sdl2-ubuntu-${{ steps.cache-keys.outputs.sdl2-hash }}
    
    - name: Cache FreeType build
      id: cache-freetype
      uses: actions/cache@v3
      with:
        path: |
          prebuilt/linux/x86_64/lib/libfreetype*
          prebuilt/linux/x86_64/include/freetype2
          prebuilt/linux/x86_64/lib/pkgconfig/freetype2.pc
        key: freetype-ubuntu-${{ steps.cache-keys.outputs.freetype-hash }}
    
    - name: Install build dependencies
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: |
          build-essential
          cmake
          ninja-build
          pkg-config
          libasound2-dev
          libpulse-dev
          libaudio-dev
          libjack-dev
          libsndio-dev
          libx11-dev
          libxext-dev
          libxrandr-dev
          libxcursor-dev
          libxfixes-dev
          libxi-dev
          libxinerama-dev
          libxxf86vm-dev
          libxss-dev
          libgl1-mesa-dev
          libdbus-1-dev
          libudev-dev
          libgles2-mesa-dev
          libegl1-mesa-dev
          libibus-1.0-dev
          fcitx-libs-dev
          libsamplerate0-dev
          libpipewire-0.3-dev
          libwayland-dev
          libdecor-0-dev
          libdrm-dev
          libgbm-dev
          libpng-dev
          zlib1g-dev
          libbz2-dev
          nasm
          autoconf
          automake
          libtool-bin
          patchelf
          libgnutls28-dev
          python3-pip
          libfribidi-dev
          libfontconfig1-dev
          libharfbuzz-dev
        version: 1.0
    
    - name: Initialize submodules
      run: |
        git submodule update --init --recursive
    
    - name: Create build directories
      run: |
        mkdir -p build/SDL2
        mkdir -p build/freetype
        mkdir -p build/cimgui
        mkdir -p build/luajit
        mkdir -p prebuilt/linux/x86_64
    
    - name: Build SDL2
      if: steps.cache-sdl2.outputs.cache-hit != 'true'
      run: |
        cd build/SDL2
        cmake ../../SDL2-2.32.4 \
          -GNinja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=$PWD/../../prebuilt/linux/x86_64 \
          -DSDL_SHARED=ON \
          -DSDL_STATIC=ON \
          -DSDL_ALSA=ON \
          -DSDL_PULSEAUDIO=ON \
          -DSDL_X11=ON \
          -DSDL_WAYLAND=ON \
          -DSDL_OPENGL=ON \
          -DSDL_OPENGLES=ON \
          -DSDL_VULKAN=ON
        ninja -j$(nproc)
        ninja install
    
    - name: SDL2 cache status
      run: |
        if [ "${{ steps.cache-sdl2.outputs.cache-hit }}" = "true" ]; then
          echo "✓ SDL2 restored from cache"
        else
          echo "✓ SDL2 built from source"
        fi
        ls -la prebuilt/linux/x86_64/lib/libSDL2* || true
    
    - name: Build FreeType
      if: steps.cache-freetype.outputs.cache-hit != 'true'
      run: |
        cd build/freetype
        cmake ../../freetype-2.14.1 \
          -GNinja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=$PWD/../../prebuilt/linux/x86_64 \
          -DBUILD_SHARED_LIBS=ON \
          -DFT_DISABLE_HARFBUZZ=ON \
          -DFT_DISABLE_BROTLI=ON \
          -DFT_DISABLE_PNG=ON \
          -DFT_DISABLE_BZIP2=ON \
          -DFT_REQUIRE_ZLIB=OFF \
          -DFT_REQUIRE_BZIP2=OFF \
          -DFT_REQUIRE_PNG=OFF
        ninja -j$(nproc)
        ninja install
    
    - name: FreeType cache status
      run: |
        if [ "${{ steps.cache-freetype.outputs.cache-hit }}" = "true" ]; then
          echo "✓ FreeType restored from cache"
        else
          echo "✓ FreeType built from source"
        fi
        ls -la prebuilt/linux/x86_64/lib/libfreetype* || true
    
    - name: Cache cimgui
      id: cache-cimgui
      uses: actions/cache@v4
      with:
        path: |
          prebuilt/linux/x86_64/lib/libcimgui_complete.so
          prebuilt/linux/x86_64/include/cimgui*
          prebuilt/linux/x86_64/include/imgui_impl_*
        key: cimgui-ubuntu-${{ steps.cache-keys.outputs.cimgui-hash }}
    
    - name: Build cimgui (ImGui C wrapper)
      if: steps.cache-cimgui.outputs.cache-hit != 'true'
      run: |
        python3 build_imgui.py \
          $PWD/prebuilt/linux/x86_64 \
          $PWD/prebuilt/linux/x86_64
    
    - name: cimgui cache status
      run: |
        if [ "${{ steps.cache-cimgui.outputs.cache-hit }}" = "true" ]; then
          echo "✓ cimgui restored from cache"
        else
          echo "✓ cimgui built from source"
        fi
        ls -la prebuilt/linux/x86_64/lib/libcimgui* || true
    
    - name: Cache LuaJIT
      id: cache-luajit
      uses: actions/cache@v4
      with:
        path: |
          prebuilt/linux/x86_64/lib/libluajit*
          prebuilt/linux/x86_64/include/luajit-2.1
          prebuilt/linux/x86_64/share/luajit*
          prebuilt/linux/x86_64/bin/luajit*
        key: luajit-ubuntu-${{ steps.cache-keys.outputs.luajit-hash }}
    
    - name: Build LuaJIT
      if: steps.cache-luajit.outputs.cache-hit != 'true'
      run: |
        cd luajit
        make -j$(nproc) PREFIX=$PWD/../prebuilt/linux/x86_64
        make install PREFIX=$PWD/../prebuilt/linux/x86_64
        cd ..
        echo "✓ LuaJIT built and installed"
    
    - name: LuaJIT cache status
      run: |
        if [ "${{ steps.cache-luajit.outputs.cache-hit }}" = "true" ]; then
          echo "✓ LuaJIT restored from cache"
        else
          echo "✓ LuaJIT built from source"
        fi
        ls -la prebuilt/linux/x86_64/lib/libluajit* || true

    - name: Cache SDL_image build
      id: cache-sdl-image
      uses: actions/cache@v4
      with:
        path: |
          prebuilt/linux/x86_64/lib/libSDL2_image*
          prebuilt/linux/x86_64/include/SDL2/SDL_image.h
        key: sdl-image-ubuntu-${{ steps.cache-keys.outputs.sdl-image-hash }}

    - name: Build SDL_image
      if: steps.cache-sdl-image.outputs.cache-hit != 'true'
      run: |
        python3 build_sdl_image.py
        echo "✓ SDL_image built with PNG, JPEG, and WebP support"

    - name: SDL_image cache status
      run: |
        if [ "${{ steps.cache-sdl-image.outputs.cache-hit }}" = "true" ]; then
          echo "✓ SDL_image restored from cache"
        else
          echo "✓ SDL_image built from source"
        fi
        ls -la prebuilt/linux/x86_64/lib/libSDL2_image* || true

    - name: Cache SDL_mixer build
      id: cache-sdl-mixer
      uses: actions/cache@v4
      with:
        path: |
          prebuilt/linux/x86_64/lib/libSDL2_mixer*
          prebuilt/linux/x86_64/include/SDL2/SDL_mixer.h
        key: sdl-mixer-ubuntu-${{ steps.cache-keys.outputs.sdl-mixer-hash }}

    - name: Build SDL_mixer
      if: steps.cache-sdl-mixer.outputs.cache-hit != 'true'
      run: |
        python3 build_sdl_mixer.py
        echo "✓ SDL_mixer built with OGG and MP3 support"

    - name: SDL_mixer cache status
      run: |
        if [ "${{ steps.cache-sdl-mixer.outputs.cache-hit }}" = "true" ]; then
          echo "✓ SDL_mixer restored from cache"
        else
          echo "✓ SDL_mixer built from source"
        fi
        ls -la prebuilt/linux/x86_64/lib/libSDL2_mixer* || true

    - name: Cache SoLoud build
      id: cache-soloud
      uses: actions/cache@v4
      with:
        path: |
          prebuilt/linux/x86_64/lib/libsoloud*
          prebuilt/linux/x86_64/include/soloud*.h
        key: soloud-ubuntu-${{ steps.cache-keys.outputs.soloud-hash }}

    - name: Build SoLoud
      if: steps.cache-soloud.outputs.cache-hit != 'true'
      run: |
        python3 build_soloud.py
        echo "✓ SoLoud built with ALSA backend"

    - name: SoLoud cache status
      run: |
        if [ "${{ steps.cache-soloud.outputs.cache-hit }}" = "true" ]; then
          echo "✓ SoLoud restored from cache"
        else
          echo "✓ SoLoud built from source"
        fi
        ls -la prebuilt/linux/x86_64/lib/libsoloud* || true

    - name: Cache libmpv+FFmpeg build
      id: cache-mpv
      # Skip the cache on tag builds: a cache HIT restores only the
      # globbed paths, never the recursively-vendored font/codec libs
      # (libfontconfig.so.* etc. -- arbitrary sonames), so the release
      # zip would ship libmpv without its bundled deps (Bug 3). Tag
      # builds always full-rebuild -> complete, self-contained bundle.
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      uses: actions/cache@v4
      with:
        path: |
          prebuilt/linux/x86_64/lib/libmpv*
          prebuilt/linux/x86_64/lib/libav*
          prebuilt/linux/x86_64/lib/libsw*
          prebuilt/linux/x86_64/lib/libpostproc*
          prebuilt/linux/x86_64/lib/pkgconfig/mpv.pc
          prebuilt/linux/x86_64/lib/pkgconfig/libav*
          prebuilt/linux/x86_64/lib/pkgconfig/libsw*
          prebuilt/linux/x86_64/lib/pkgconfig/libpostproc*
          prebuilt/linux/x86_64/lib/pkgconfig/libplacebo.pc
          prebuilt/linux/x86_64/lib/pkgconfig/libass.pc
          prebuilt/linux/x86_64/include/mpv
          prebuilt/linux/x86_64/include/libav*
          prebuilt/linux/x86_64/include/libsw*
          prebuilt/linux/x86_64/include/libpostproc*
        key: mpv-ubuntu-${{ steps.cache-keys.outputs.mpv-hash }}

    - name: Build libmpv+FFmpeg
      if: steps.cache-mpv.outputs.cache-hit != 'true'
      run: |
        # mpv 0.40 needs a newer meson/ninja than Ubuntu 22.04 apt
        # ships; pip is the reproducible source.
        pip3 install --user 'meson>=1.3' ninja
        export PATH="$HOME/.local/bin:$PATH"
        python3 build_mpv.py
        echo "libmpv+FFmpeg built (pinned, version-consistent)"

    - name: libmpv cache status
      run: |
        if [ "${{ steps.cache-mpv.outputs.cache-hit }}" = "true" ]; then
          echo "✓ libmpv+FFmpeg restored from cache"
        else
          echo "✓ libmpv+FFmpeg built from source"
        fi
        ls -la prebuilt/linux/x86_64/lib/libmpv* prebuilt/linux/x86_64/lib/libav* 2>/dev/null || true

    - name: Create library info file
      run: |
        cat > prebuilt/linux/x86_64/library_info.txt << EOF
        Built on: $(date)
        Platform: Ubuntu $(lsb_release -rs)

        Libraries included:
        - SDL2 Version: 2.32.4
        - FreeType Version: 2.14.1
        - cimgui (Dear ImGui C wrapper) with SDL2/OpenGL3 backends
        - LuaJIT 2.1 - Just-In-Time Compiler for Lua
        - SDL_image 2.8.2 - Image loading (PNG, JPEG, WebP support)
        - SDL_mixer 2.8.0 - Audio mixing (WAV, OGG, MP3 support)
        - SoLoud 20200207 - Portable audio engine with ALSA backend
        
        Libraries:
        $(ls -la prebuilt/linux/x86_64/lib/)
        
        Headers:
        $(ls -la prebuilt/linux/x86_64/include/)
        EOF
    
    - name: List built files
      run: |
        echo "=== Built libraries ==="
        find prebuilt/linux/x86_64 -type f -name "*.so*" -o -name "*.a" | sort
        echo ""
        echo "=== Header files ==="
        find prebuilt/linux/x86_64/include -type f -name "*.h" | head -20
    
    - name: Create release archive
      run: |
        cd prebuilt/linux/x86_64
        zip -ry ../../../gamelibs-linux-x86_64.zip .
        cd ../../..
        echo "Archive created: $(ls -lh gamelibs-linux-x86_64.zip)"
    
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: gamelibs-linux-x86_64
        path: gamelibs-linux-x86_64.zip
        retention-days: 7

  build-windows:
    runs-on: windows-latest
    name: Build Windows x86_64

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Generate cache keys
      id: cache-keys
      shell: bash
      run: |
        # Cache version - increment this to force cache rebuild
        CACHE_VERSION="v1"

        # Add manual cache clear suffix if requested
        if [ "${{ github.event.inputs.clear_cache }}" = "true" ]; then
          CACHE_SUFFIX="-cleared-$(date +%s)"
        else
          CACHE_SUFFIX=""
        fi

        # Generate hash of SDL2 source for cache key
        SDL2_HASH=$(find SDL2-2.32.4 -type f -name '*.c' -o -name '*.h' -o -name 'CMakeLists.txt' | head -100 | xargs sha256sum | sha256sum | cut -d' ' -f1)
        echo "sdl2-hash=${CACHE_VERSION}-${SDL2_HASH}${CACHE_SUFFIX}" >> $GITHUB_OUTPUT

        # Generate hash of FreeType source for cache key
        FT_HASH=$(find freetype-2.14.1 -type f -name '*.c' -o -name '*.h' -o -name 'CMakeLists.txt' | head -100 | xargs sha256sum | sha256sum | cut -d' ' -f1)
        echo "freetype-hash=${CACHE_VERSION}-${FT_HASH}${CACHE_SUFFIX}" >> $GITHUB_OUTPUT

        # Generate hash of cimgui source for cache key
        CIMGUI_HASH=$(find cimgui -type f -name '*.cpp' -o -name '*.h' -o -name 'CMakeLists.txt' | head -100 | xargs sha256sum | sha256sum | cut -d' ' -f1)
        echo "cimgui-hash=${CACHE_VERSION}-${CIMGUI_HASH}${CACHE_SUFFIX}" >> $GITHUB_OUTPUT

        # Generate hash of LuaJIT source for cache key
        LUAJIT_HASH=$(find luajit -type f -name '*.c' -o -name '*.h' -o -name 'Makefile' | head -100 | xargs sha256sum | sha256sum | cut -d' ' -f1)
        echo "luajit-hash=${CACHE_VERSION}-${LUAJIT_HASH}${CACHE_SUFFIX}" >> $GITHUB_OUTPUT

        # Generate hash of SDL_image build script for cache key
        SDL_IMAGE_HASH=$(sha256sum build_sdl_image.py SDL2_image-2.8.2/CMakeLists.txt 2>/dev/null | sha256sum | cut -d' ' -f1)
        echo "sdl-image-hash=${CACHE_VERSION}-${SDL_IMAGE_HASH}${CACHE_SUFFIX}" >> $GITHUB_OUTPUT

        # Generate hash of SDL_mixer build script for cache key
        SDL_MIXER_HASH=$(sha256sum build_sdl_mixer.py SDL2_mixer-2.8.0/CMakeLists.txt 2>/dev/null | sha256sum | cut -d' ' -f1)
        echo "sdl-mixer-hash=${CACHE_VERSION}-${SDL_MIXER_HASH}${CACHE_SUFFIX}" >> $GITHUB_OUTPUT

        # Generate hash of SoLoud build script and source for cache key
        SOLOUD_HASH=$(find soloud-RELEASE_20200207 -type f -name '*.cpp' -o -name '*.c' -o -name '*.h' | head -100 | xargs sha256sum 2>/dev/null | sha256sum | cut -d' ' -f1)
        SOLOUD_SCRIPT_HASH=$(sha256sum build_soloud.py 2>/dev/null | cut -d' ' -f1)
        echo "soloud-hash=${CACHE_VERSION}-${SOLOUD_HASH}-${SOLOUD_SCRIPT_HASH}${CACHE_SUFFIX}" >> $GITHUB_OUTPUT

        # libmpv+FFmpeg: build_mpv.py embeds the pinned FFmpeg/mpv/
        # mpv-build refs, so hashing the script alone captures any pin
        # bump. ffmpeg+mpv compile is ~10-30min on a runner -- caching
        # the staged output is mandatory.
        # NB: git hash-object, NOT sha256sum -- sha256sum is Linux-only
        # (absent on macOS runners), which silently produced an empty
        # hash there => a constant cache key that never invalidated, so
        # macOS shipped a stale build for two releases. git is present
        # and deterministic on every runner.
        MPV_HASH=$(git hash-object build_mpv.py)
        echo "mpv-hash=${CACHE_VERSION}-${MPV_HASH}${CACHE_SUFFIX}" >> $GITHUB_OUTPUT

    - name: Cache SDL2 build
      id: cache-sdl2
      uses: actions/cache@v3
      with:
        path: |
          prebuilt/windows/x86_64/lib/SDL2*
          prebuilt/windows/x86_64/include/SDL2
          prebuilt/windows/x86_64/bin/SDL2.dll
        key: sdl2-windows-${{ steps.cache-keys.outputs.sdl2-hash }}
    
    - name: Cache FreeType build
      id: cache-freetype
      uses: actions/cache@v3
      with:
        path: |
          prebuilt/windows/x86_64/lib/freetype*
          prebuilt/windows/x86_64/include/freetype2
          prebuilt/windows/x86_64/bin/freetype.dll
        key: freetype-windows-${{ steps.cache-keys.outputs.freetype-hash }}
    
    - name: Initialize submodules
      run: |
        git submodule update --init --recursive
    
    - name: Create build directories
      shell: bash
      run: |
        mkdir -p build/SDL2
        mkdir -p build/freetype
        mkdir -p build/cimgui
        mkdir -p build/luajit
        mkdir -p prebuilt/windows/x86_64
    
    - name: Build SDL2
      if: steps.cache-sdl2.outputs.cache-hit != 'true'
      shell: cmd
      run: |
        cd build\SDL2
        cmake ..\..\SDL2-2.32.4 ^
          -G "Visual Studio 17 2022" ^
          -A x64 ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DCMAKE_INSTALL_PREFIX=%CD%\..\..\prebuilt\windows\x86_64 ^
          -DSDL_SHARED=ON ^
          -DSDL_STATIC=ON
        cmake --build . --config Release --parallel
        cmake --install . --config Release
    
    - name: SDL2 cache status
      shell: bash
      run: |
        if [ "${{ steps.cache-sdl2.outputs.cache-hit }}" = "true" ]; then
          echo "✓ SDL2 restored from cache"
        else
          echo "✓ SDL2 built from source"
        fi
        ls -la prebuilt/windows/x86_64/lib/SDL2* || true
        ls -la prebuilt/windows/x86_64/bin/SDL2* || true
    
    - name: Build FreeType
      if: steps.cache-freetype.outputs.cache-hit != 'true'
      shell: cmd
      run: |
        cd build\freetype
        cmake ..\..\freetype-2.14.1 ^
          -G "Visual Studio 17 2022" ^
          -A x64 ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DCMAKE_INSTALL_PREFIX=%CD%\..\..\prebuilt\windows\x86_64 ^
          -DBUILD_SHARED_LIBS=ON ^
          -DFT_DISABLE_HARFBUZZ=ON ^
          -DFT_DISABLE_BROTLI=ON ^
          -DFT_DISABLE_PNG=ON ^
          -DFT_DISABLE_BZIP2=ON ^
          -DFT_REQUIRE_ZLIB=OFF ^
          -DFT_REQUIRE_BZIP2=OFF ^
          -DFT_REQUIRE_PNG=OFF
        cmake --build . --config Release --parallel
        cmake --install . --config Release
    
    - name: FreeType cache status
      shell: bash
      run: |
        if [ "${{ steps.cache-freetype.outputs.cache-hit }}" = "true" ]; then
          echo "✓ FreeType restored from cache"
        else
          echo "✓ FreeType built from source"
        fi
        ls -la prebuilt/windows/x86_64/lib/freetype* || true
        ls -la prebuilt/windows/x86_64/bin/freetype* || true
    
    - name: Cache cimgui
      id: cache-cimgui
      uses: actions/cache@v3
      with:
        path: |
          prebuilt/windows/x86_64/lib/cimgui*
          prebuilt/windows/x86_64/bin/cimgui*
          prebuilt/windows/x86_64/include/cimgui*
          prebuilt/windows/x86_64/include/imgui_impl_*
        key: cimgui-windows-${{ steps.cache-keys.outputs.cimgui-hash }}
    
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      
    - name: Build cimgui (ImGui C wrapper)
      if: steps.cache-cimgui.outputs.cache-hit != 'true'
      shell: cmd
      run: |
        python build_imgui.py ^
          %cd%\prebuilt\windows\x86_64 ^
          %cd%\prebuilt\windows\x86_64
    
    - name: cimgui cache status
      shell: bash
      run: |
        if [ "${{ steps.cache-cimgui.outputs.cache-hit }}" = "true" ]; then
          echo "✓ cimgui restored from cache"
        else
          echo "✓ cimgui built from source"
        fi
        ls -la prebuilt/windows/x86_64/lib/cimgui* || true
        ls -la prebuilt/windows/x86_64/bin/cimgui* || true
    
    - name: Cache LuaJIT
      id: cache-luajit
      uses: actions/cache@v3
      with:
        path: |
          prebuilt/windows/x86_64/lib/lua51*
          prebuilt/windows/x86_64/bin/lua51*
          prebuilt/windows/x86_64/bin/luajit*
          prebuilt/windows/x86_64/include/lua*
        key: luajit-windows-${{ steps.cache-keys.outputs.luajit-hash }}
    
    - name: Build LuaJIT (Windows)
      if: steps.cache-luajit.outputs.cache-hit != 'true'
      shell: cmd
      run: |
        cd luajit\src
        call msvcbuild.bat
        xcopy luajit.exe ..\..\prebuilt\windows\x86_64\bin\ /Y
        xcopy lua51.dll ..\..\prebuilt\windows\x86_64\bin\ /Y
        xcopy lua51.lib ..\..\prebuilt\windows\x86_64\lib\ /Y
        xcopy luajit.h ..\..\prebuilt\windows\x86_64\include\ /Y
        xcopy lua.h ..\..\prebuilt\windows\x86_64\include\ /Y
        xcopy lauxlib.h ..\..\prebuilt\windows\x86_64\include\ /Y
        xcopy lualib.h ..\..\prebuilt\windows\x86_64\include\ /Y
        xcopy luaconf.h ..\..\prebuilt\windows\x86_64\include\ /Y
        xcopy lua.hpp ..\..\prebuilt\windows\x86_64\include\ /Y
        cd ..\..
        echo LuaJIT built and installed
    
    - name: LuaJIT cache status
      shell: bash
      run: |
        if [ "${{ steps.cache-luajit.outputs.cache-hit }}" = "true" ]; then
          echo "✓ LuaJIT restored from cache"
        else
          echo "✓ LuaJIT built from source"
        fi
        ls -la prebuilt/windows/x86_64/lib/lua51* || true
        ls -la prebuilt/windows/x86_64/bin/lua* || true

    - name: Cache SDL_image build
      id: cache-sdl-image
      uses: actions/cache@v4
      with:
        path: |
          prebuilt/windows/x86_64/lib/SDL2_image*
          prebuilt/windows/x86_64/bin/SDL2_image*
          prebuilt/windows/x86_64/include/SDL2/SDL_image.h
        key: sdl-image-windows-${{ steps.cache-keys.outputs.sdl-image-hash }}

    - name: Build SDL_image
      if: steps.cache-sdl-image.outputs.cache-hit != 'true'
      shell: bash
      run: |
        python build_sdl_image.py
        echo "✓ SDL_image built with PNG, JPEG, and WebP support"

    - name: SDL_image cache status
      shell: bash
      run: |
        if [ "${{ steps.cache-sdl-image.outputs.cache-hit }}" = "true" ]; then
          echo "✓ SDL_image restored from cache"
        else
          echo "✓ SDL_image built from source"
        fi
        ls -la prebuilt/windows/x86_64/lib/SDL2_image* || true
        ls -la prebuilt/windows/x86_64/bin/SDL2_image* || true

    - name: Cache SDL_mixer build
      id: cache-sdl-mixer
      uses: actions/cache@v4
      with:
        path: |
          prebuilt/windows/x86_64/lib/SDL2_mixer*
          prebuilt/windows/x86_64/bin/SDL2_mixer*
          prebuilt/windows/x86_64/include/SDL2/SDL_mixer.h
        key: sdl-mixer-windows-${{ steps.cache-keys.outputs.sdl-mixer-hash }}

    - name: Build SDL_mixer
      if: steps.cache-sdl-mixer.outputs.cache-hit != 'true'
      shell: bash
      run: |
        python build_sdl_mixer.py
        echo "✓ SDL_mixer built with OGG and MP3 support"

    - name: SDL_mixer cache status
      shell: bash
      run: |
        if [ "${{ steps.cache-sdl-mixer.outputs.cache-hit }}" = "true" ]; then
          echo "✓ SDL_mixer restored from cache"
        else
          echo "✓ SDL_mixer built from source"
        fi
        ls -la prebuilt/windows/x86_64/lib/SDL2_mixer* || true
        ls -la prebuilt/windows/x86_64/bin/SDL2_mixer* || true

    - name: Cache SoLoud build
      id: cache-soloud
      uses: actions/cache@v4
      with:
        path: |
          prebuilt/windows/x86_64/lib/soloud*
          prebuilt/windows/x86_64/bin/soloud*
          prebuilt/windows/x86_64/include/soloud*.h
        key: soloud-windows-${{ steps.cache-keys.outputs.soloud-hash }}

    - name: Build SoLoud
      if: steps.cache-soloud.outputs.cache-hit != 'true'
      shell: bash
      run: |
        python build_soloud.py
        echo "✓ SoLoud built with WinMM backend"

    - name: SoLoud cache status
      shell: bash
      run: |
        if [ "${{ steps.cache-soloud.outputs.cache-hit }}" = "true" ]; then
          echo "✓ SoLoud restored from cache"
        else
          echo "✓ SoLoud built from source"
        fi
        ls -la prebuilt/windows/x86_64/lib/soloud* || true
        ls -la prebuilt/windows/x86_64/bin/soloud* || true

    - name: Cache libmpv+FFmpeg build
      id: cache-mpv
      # See the ubuntu job: skip on tag builds so releases full-rebuild
      # and ship the recursively-vendored mingw font DLLs (Bug 3).
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      uses: actions/cache@v4
      with:
        # Targeted globs (not the whole bin/ or pkgconfig/ -- those are
        # shared with SDL2/etc. built in the same job; a whole-dir
        # cache under the mpv key would restore stale sibling libs).
        # Recursively-vendored mingw font DLLs are intentionally NOT
        # cached: they have arbitrary sonames and are only needed in
        # shipped (tag) bundles, which skip the cache and full-rebuild.
        path: |
          prebuilt/windows/x86_64/bin/mpv*.dll
          prebuilt/windows/x86_64/bin/libmpv*.dll
          prebuilt/windows/x86_64/bin/av*.dll
          prebuilt/windows/x86_64/bin/sw*.dll
          prebuilt/windows/x86_64/bin/postproc*.dll
          prebuilt/windows/x86_64/lib/libmpv*
          prebuilt/windows/x86_64/lib/libav*
          prebuilt/windows/x86_64/lib/libsw*
          prebuilt/windows/x86_64/lib/libpostproc*
          prebuilt/windows/x86_64/lib/pkgconfig/mpv.pc
          prebuilt/windows/x86_64/lib/pkgconfig/libav*
          prebuilt/windows/x86_64/lib/pkgconfig/libsw*
          prebuilt/windows/x86_64/lib/pkgconfig/libpostproc*
          prebuilt/windows/x86_64/lib/pkgconfig/libplacebo.pc
          prebuilt/windows/x86_64/lib/pkgconfig/libass.pc
          prebuilt/windows/x86_64/include/mpv
          prebuilt/windows/x86_64/include/libav*
          prebuilt/windows/x86_64/include/libsw*
          prebuilt/windows/x86_64/include/libpostproc*
        key: mpv-windows-x86_64-${{ steps.cache-keys.outputs.mpv-hash }}

    - name: Setup MSYS2 (libmpv+FFmpeg toolchain)
      if: steps.cache-mpv.outputs.cache-hit != 'true'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        # mpv-build compiles ffmpeg + libass + libplacebo + mpv from
        # our pinned sources; these are its toolchain + the libass/
        # libplacebo dependencies (same role as the ubuntu apt /
        # macos brew sets, in mingw-w64 form).
        install: >-
          git diffutils
          autoconf
          automake
          libtool
          make
          gettext
          gettext-devel
          pkgconf
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-meson
          mingw-w64-x86_64-ninja
          mingw-w64-x86_64-nasm
          mingw-w64-x86_64-pkgconf
          mingw-w64-x86_64-gnutls
          mingw-w64-x86_64-python
          mingw-w64-x86_64-fribidi
          mingw-w64-x86_64-harfbuzz
          mingw-w64-x86_64-freetype
          mingw-w64-x86_64-fontconfig
          mingw-w64-x86_64-libpng
          mingw-w64-x86_64-libjpeg-turbo
          mingw-w64-x86_64-lcms2
          mingw-w64-x86_64-vulkan-headers
          mingw-w64-x86_64-vulkan-loader

    - name: Build libmpv+FFmpeg
      if: steps.cache-mpv.outputs.cache-hit != 'true'
      shell: msys2 {0}
      run: |
        # Self-built, version-consistent libmpv + shared FFmpeg under
        # the MSYS2 MINGW64 toolchain (no third-party prebuilts). libass
        # is built with Meson here (build_mpv.py, Windows path) instead
        # of mpv-build's autotools step: libass autogen.sh -> aclocal
        # hits an unfixable msys2 path-canonicalization bug (six prior
        # shim rounds). Meson never invokes aclocal, removing the whole
        # failure class. No aclocal/autotools env shims needed anymore.
        #
        # Clear the inherited PKG_CONFIG_PATH. actions/setup-python sets
        # it to C:\hostedtoolcache\...\lib/pkgconfig (a Windows path
        # with a drive colon). mpv-build's *-config scripts APPEND
        # $BUILD/build_libs/lib/pkgconfig to it with a POSIX ':'
        # separator; the inherited 'C:' colon then makes the list
        # unparseable to pkgconf, so mpv can't find the libav*.pc that
        # ffmpeg installed into build_libs -> "Dependency libavcodec
        # not found". Empty -> mpv-build's scripts use just the clean
        # msys build_libs path; mingw deps come from pkgconf's built-in
        # /mingw64 dir regardless.
        unset PKG_CONFIG_PATH
        python build_mpv.py
        echo "libmpv+FFmpeg built (pinned, version-consistent, mingw)"

    - name: libmpv cache status
      shell: bash
      run: |
        if [ "${{ steps.cache-mpv.outputs.cache-hit }}" = "true" ]; then
          echo "✓ libmpv+FFmpeg restored from cache"
        else
          echo "✓ libmpv+FFmpeg built from source"
        fi
        ls -la prebuilt/windows/x86_64/bin/*mpv*.dll prebuilt/windows/x86_64/bin/av*.dll 2>/dev/null || true

    - name: Create library info file
      shell: bash
      run: |
        cat > prebuilt/windows/x86_64/library_info.txt << EOF
        Built on: $(date)
        Platform: Windows x86_64

        Libraries included:
        - SDL2 Version: 2.32.4
        - FreeType Version: 2.14.1
        - cimgui (Dear ImGui C wrapper) with SDL2/OpenGL3 backends
        - LuaJIT 2.1 - Just-In-Time Compiler for Lua
        - SDL_image 2.8.2 - Image loading (PNG, JPEG, WebP support)
        - SDL_mixer 2.8.0 - Audio mixing (WAV, OGG, MP3 support)
        - SoLoud 20200207 - Portable audio engine with WinMM backend
        
        Libraries:
        $(ls -la prebuilt/windows/x86_64/lib/)
        
        Binaries (DLLs):
        $(ls -la prebuilt/windows/x86_64/bin/)
        
        Headers:
        $(ls -la prebuilt/windows/x86_64/include/)
        EOF
    
    - name: List built files
      shell: bash
      run: |
        echo "=== Built libraries ==="
        find prebuilt/windows/x86_64 -type f -name "*.lib" -o -name "*.dll" | sort
        echo ""
        echo "=== Header files ==="
        find prebuilt/windows/x86_64/include -type f -name "*.h" | head -20
    
    - name: Create release archive
      shell: bash
      run: |
        cd prebuilt/windows/x86_64
        7z a -tzip ../../../gamelibs-windows-x86_64.zip *
        cd ../../..
        echo "Archive created: $(ls -lh gamelibs-windows-x86_64.zip)"
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: gamelibs-windows-x86_64
        path: gamelibs-windows-x86_64.zip
        retention-days: 7

  build-macos:
    runs-on: macos-latest
    name: Build macOS ARM64
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Initialize submodules
      run: |
        git submodule update --init --recursive
        cd cimgui && git submodule update --init --recursive && cd ..
    
    - name: Generate cache keys
      id: cache-keys
      run: |
        # Cache version - increment this to force cache rebuild
        CACHE_VERSION="v1"
        
        # Add manual cache clear suffix if requested
        if [ "${{ github.event.inputs.clear_cache }}" = "true" ]; then
          CACHE_SUFFIX="-cleared-$(date +%s)"
        else
          CACHE_SUFFIX=""
        fi
        
        # Generate hash of SDL2 source for cache key
        SDL2_HASH=$(find SDL2-2.32.4 -type f -name '*.c' -o -name '*.h' -o -name 'CMakeLists.txt' | head -100 | xargs shasum -a 256 | shasum -a 256 | cut -d' ' -f1)
        echo "sdl2-hash=${CACHE_VERSION}-${SDL2_HASH}${CACHE_SUFFIX}" >> $GITHUB_OUTPUT
        
        # Generate hash of FreeType source for cache key
        FT_HASH=$(find freetype-2.14.1 -type f -name '*.c' -o -name '*.h' -o -name 'CMakeLists.txt' | head -100 | xargs shasum -a 256 | shasum -a 256 | cut -d' ' -f1)
        echo "freetype-hash=${CACHE_VERSION}-${FT_HASH}${CACHE_SUFFIX}" >> $GITHUB_OUTPUT
        
        # Generate hash of cimgui source for cache key
        CIMGUI_HASH=$(find cimgui -type f -name '*.cpp' -o -name '*.h' -o -name 'CMakeLists.txt' | head -100 | xargs shasum -a 256 | shasum -a 256 | cut -d' ' -f1)
        echo "cimgui-hash=${CACHE_VERSION}-${CIMGUI_HASH}${CACHE_SUFFIX}" >> $GITHUB_OUTPUT
        
        # Generate hash of LuaJIT source for cache key
        LUAJIT_HASH=$(find luajit -type f -name '*.c' -o -name '*.h' -o -name 'Makefile' | head -100 | xargs shasum -a 256 | shasum -a 256 | cut -d' ' -f1)
        echo "luajit-hash=${CACHE_VERSION}-${LUAJIT_HASH}${CACHE_SUFFIX}" >> $GITHUB_OUTPUT

        # Generate hash of SoLoud build script and source for cache key
        SOLOUD_HASH=$(find soloud-RELEASE_20200207 -type f -name '*.cpp' -o -name '*.c' -o -name '*.h' | head -100 | xargs shasum -a 256 2>/dev/null | shasum -a 256 | cut -d' ' -f1)
        SOLOUD_SCRIPT_HASH=$(shasum -a 256 build_soloud.py 2>/dev/null | cut -d' ' -f1)
        echo "soloud-hash=${CACHE_VERSION}-${SOLOUD_HASH}-${SOLOUD_SCRIPT_HASH}${CACHE_SUFFIX}" >> $GITHUB_OUTPUT

        # libmpv+FFmpeg: hash build_mpv.py (embeds the pinned refs).
        # This line was missing from the macOS job, so mpv-hash was
        # empty -> key collapsed to the constant "mpv-macos-arm64-" and
        # macOS restored a stale pre-regression libmpv on every run,
        # masking real build status. git hash-object is portable.
        MPV_HASH=$(git hash-object build_mpv.py)
        echo "mpv-hash=${CACHE_VERSION}-${MPV_HASH}${CACHE_SUFFIX}" >> $GITHUB_OUTPUT

    - name: Setup build environment
      run: |
        brew install cmake ninja pkg-config meson nasm \
          autoconf automake libtool fribidi fontconfig harfbuzz
        echo "Build environment ready"
    
    - name: Create build directories
      run: |
        mkdir -p build/{sdl2,freetype}
        mkdir -p prebuilt/macos/arm64/{lib,bin,include}
    
    # Cache SDL2 build
    - name: Cache SDL2
      id: cache-sdl2
      uses: actions/cache@v4
      with:
        path: |
          prebuilt/macos/arm64/lib/libSDL2*
          prebuilt/macos/arm64/include/SDL2
        key: macos-sdl2-${{ steps.cache-keys.outputs.sdl2-hash }}
    
    - name: Build SDL2
      if: steps.cache-sdl2.outputs.cache-hit != 'true'
      run: |
        cd build/sdl2
        cmake ../../SDL2-2.32.4 \
          -GNinja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=$PWD/../../prebuilt/macos/arm64 \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DSDL_SHARED=ON \
          -DSDL_STATIC=ON
        ninja -j$(sysctl -n hw.ncpu)
        ninja install
    
    - name: SDL2 cache status
      run: |
        if [ "${{ steps.cache-sdl2.outputs.cache-hit }}" = "true" ]; then
          echo "✓ SDL2 restored from cache"
        else
          echo "✓ SDL2 built from source"
        fi
        ls -la prebuilt/macos/arm64/lib/libSDL2* || true
    
    # Cache FreeType build
    - name: Cache FreeType
      id: cache-freetype
      uses: actions/cache@v4
      with:
        path: |
          prebuilt/macos/arm64/lib/libfreetype*
          prebuilt/macos/arm64/include/freetype2
        key: macos-freetype-${{ steps.cache-keys.outputs.freetype-hash }}
    
    - name: Build FreeType
      if: steps.cache-freetype.outputs.cache-hit != 'true'
      run: |
        cd build/freetype
        cmake ../../freetype-2.14.1 \
          -GNinja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=$PWD/../../prebuilt/macos/arm64 \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DBUILD_SHARED_LIBS=ON \
          -DFT_DISABLE_HARFBUZZ=ON \
          -DFT_DISABLE_BROTLI=ON \
          -DFT_DISABLE_PNG=ON \
          -DFT_DISABLE_BZIP2=ON \
          -DFT_REQUIRE_ZLIB=OFF \
          -DFT_REQUIRE_BZIP2=OFF \
          -DFT_REQUIRE_PNG=OFF
        ninja -j$(sysctl -n hw.ncpu)
        ninja install
    
    - name: FreeType cache status
      run: |
        if [ "${{ steps.cache-freetype.outputs.cache-hit }}" = "true" ]; then
          echo "✓ FreeType restored from cache"
        else
          echo "✓ FreeType built from source"
        fi
        ls -la prebuilt/macos/arm64/lib/libfreetype* || true
    
    - name: Cache cimgui
      id: cache-cimgui
      uses: actions/cache@v4
      with:
        path: |
          prebuilt/macos/arm64/lib/libcimgui*
          prebuilt/macos/arm64/include/cimgui*
          prebuilt/macos/arm64/include/imgui_impl_*
        key: cimgui-macos-${{ steps.cache-keys.outputs.cimgui-hash }}
    
    - name: Build cimgui (ImGui C wrapper)
      if: steps.cache-cimgui.outputs.cache-hit != 'true'
      run: |
        python3 build_imgui.py \
          $PWD/prebuilt/macos/arm64 \
          $PWD/prebuilt/macos/arm64
    
    - name: cimgui cache status
      run: |
        if [ "${{ steps.cache-cimgui.outputs.cache-hit }}" = "true" ]; then
          echo "✓ cimgui restored from cache"
        else
          echo "✓ cimgui built from source"
        fi
        ls -la prebuilt/macos/arm64/lib/libcimgui* || true

    - name: Cache LuaJIT
      id: cache-luajit
      uses: actions/cache@v4
      with:
        path: |
          prebuilt/macos/arm64/lib/libluajit*
          prebuilt/macos/arm64/include/luajit-2.1
          prebuilt/macos/arm64/share/luajit*
          prebuilt/macos/arm64/bin/luajit*
        key: luajit-macos-${{ steps.cache-keys.outputs.luajit-hash }}
    
    - name: Build LuaJIT
      if: steps.cache-luajit.outputs.cache-hit != 'true'
      run: |
        cd luajit
        make -j$(sysctl -n hw.ncpu) PREFIX=$PWD/../prebuilt/macos/arm64 MACOSX_DEPLOYMENT_TARGET=11.0 TARGET_FLAGS="-arch arm64"
        make install PREFIX=$PWD/../prebuilt/macos/arm64
        cd ..
        echo "✓ LuaJIT built and installed"
    
    - name: LuaJIT cache status
      run: |
        if [ "${{ steps.cache-luajit.outputs.cache-hit }}" = "true" ]; then
          echo "✓ LuaJIT restored from cache"
        else
          echo "✓ LuaJIT built from source"
        fi
        ls -la prebuilt/macos/arm64/lib/libluajit* || true

    - name: Cache SDL_image build
      id: cache-sdl-image
      uses: actions/cache@v4
      with:
        path: |
          prebuilt/macos/arm64/lib/libSDL2_image*
          prebuilt/macos/arm64/include/SDL2/SDL_image.h
        key: sdl-image-macos-${{ steps.cache-keys.outputs.sdl-image-hash }}

    - name: Build SDL_image
      if: steps.cache-sdl-image.outputs.cache-hit != 'true'
      run: |
        python3 build_sdl_image.py
        echo "✓ SDL_image built with PNG, JPEG, and WebP support"

    - name: SDL_image cache status
      run: |
        if [ "${{ steps.cache-sdl-image.outputs.cache-hit }}" = "true" ]; then
          echo "✓ SDL_image restored from cache"
        else
          echo "✓ SDL_image built from source"
        fi
        ls -la prebuilt/macos/arm64/lib/libSDL2_image* || true

    - name: Cache SDL_mixer build
      id: cache-sdl-mixer
      uses: actions/cache@v4
      with:
        path: |
          prebuilt/macos/arm64/lib/libSDL2_mixer*
          prebuilt/macos/arm64/include/SDL2/SDL_mixer.h
        key: sdl-mixer-macos-${{ steps.cache-keys.outputs.sdl-mixer-hash }}

    - name: Build SDL_mixer
      if: steps.cache-sdl-mixer.outputs.cache-hit != 'true'
      run: |
        python3 build_sdl_mixer.py
        echo "✓ SDL_mixer built with OGG and MP3 support"

    - name: SDL_mixer cache status
      run: |
        if [ "${{ steps.cache-sdl-mixer.outputs.cache-hit }}" = "true" ]; then
          echo "✓ SDL_mixer restored from cache"
        else
          echo "✓ SDL_mixer built from source"
        fi
        ls -la prebuilt/macos/arm64/lib/libSDL2_mixer* || true

    - name: Cache SoLoud build
      id: cache-soloud
      uses: actions/cache@v4
      with:
        path: |
          prebuilt/macos/arm64/lib/libsoloud*
          prebuilt/macos/arm64/include/soloud*.h
        key: soloud-macos-${{ steps.cache-keys.outputs.soloud-hash }}

    - name: Build SoLoud
      if: steps.cache-soloud.outputs.cache-hit != 'true'
      run: |
        python3 build_soloud.py
        echo "✓ SoLoud built with CoreAudio backend"

    - name: SoLoud cache status
      run: |
        if [ "${{ steps.cache-soloud.outputs.cache-hit }}" = "true" ]; then
          echo "✓ SoLoud restored from cache"
        else
          echo "✓ SoLoud built from source"
        fi
        ls -la prebuilt/macos/arm64/lib/libsoloud* || true

    - name: Cache libmpv+FFmpeg build
      id: cache-mpv
      # See the ubuntu job: skip on tag builds so releases full-rebuild
      # and ship the recursively-vendored Homebrew dylibs (Bug 3 -- the
      # original symptom: run 25960133197's macOS cache HIT shipped a
      # bundle with zero .pc and partial libav*).
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      uses: actions/cache@v4
      with:
        path: |
          prebuilt/macos/arm64/lib/libmpv*
          prebuilt/macos/arm64/lib/libav*
          prebuilt/macos/arm64/lib/libsw*
          prebuilt/macos/arm64/lib/libpostproc*
          prebuilt/macos/arm64/lib/pkgconfig/mpv.pc
          prebuilt/macos/arm64/lib/pkgconfig/libav*
          prebuilt/macos/arm64/lib/pkgconfig/libsw*
          prebuilt/macos/arm64/lib/pkgconfig/libpostproc*
          prebuilt/macos/arm64/lib/pkgconfig/libplacebo.pc
          prebuilt/macos/arm64/lib/pkgconfig/libass.pc
          prebuilt/macos/arm64/include/mpv
          prebuilt/macos/arm64/include/libav*
          prebuilt/macos/arm64/include/libsw*
          prebuilt/macos/arm64/include/libpostproc*
        key: mpv-macos-arm64-${{ steps.cache-keys.outputs.mpv-hash }}

    - name: Build libmpv+FFmpeg
      if: steps.cache-mpv.outputs.cache-hit != 'true'
      run: |
        python3 build_mpv.py
        echo "libmpv+FFmpeg built (pinned, version-consistent)"

    - name: libmpv cache status
      run: |
        if [ "${{ steps.cache-mpv.outputs.cache-hit }}" = "true" ]; then
          echo "✓ libmpv+FFmpeg restored from cache"
        else
          echo "✓ libmpv+FFmpeg built from source"
        fi
        ls -la prebuilt/macos/arm64/lib/libmpv* prebuilt/macos/arm64/lib/libav* 2>/dev/null || true

    - name: Create library info file
      run: |
        cat > prebuilt/macos/arm64/library_info.txt << EOF
        Built on: $(date)
        Platform: macOS $(sw_vers -productVersion)
        Architecture: arm64

        Libraries included:
        - SDL2 Version: 2.32.4
        - FreeType Version: 2.14.1
        - cimgui (Dear ImGui C wrapper) with SDL2/OpenGL3 backends
        - LuaJIT Version: 2.1
        - SDL_image 2.8.2 - Image loading (PNG, JPEG, WebP support)
        - SDL_mixer 2.8.0 - Audio mixing (WAV, OGG, MP3 support)
        - SoLoud 20200207 - Portable audio engine with CoreAudio backend
        
        Library files:
        EOF
        echo "" >> prebuilt/macos/arm64/library_info.txt
        echo "=== SDL2 ===" >> prebuilt/macos/arm64/library_info.txt
        ls -la prebuilt/macos/arm64/lib/libSDL2* >> prebuilt/macos/arm64/library_info.txt
        echo "" >> prebuilt/macos/arm64/library_info.txt
        echo "=== FreeType ===" >> prebuilt/macos/arm64/library_info.txt
        ls -la prebuilt/macos/arm64/lib/libfreetype* >> prebuilt/macos/arm64/library_info.txt
        echo "" >> prebuilt/macos/arm64/library_info.txt
        echo "=== cimgui ===" >> prebuilt/macos/arm64/library_info.txt
        ls -la prebuilt/macos/arm64/lib/libcimgui* >> prebuilt/macos/arm64/library_info.txt
        echo "" >> prebuilt/macos/arm64/library_info.txt
        echo "=== LuaJIT ===" >> prebuilt/macos/arm64/library_info.txt
        ls -la prebuilt/macos/arm64/lib/libluajit* >> prebuilt/macos/arm64/library_info.txt
    
    - name: List built libraries
      run: |
        echo "=== All library files ==="
        find prebuilt/macos/arm64/lib -type f \( -name "*.dylib" -o -name "*.a" \) | sort
        echo ""
        echo "=== Header files ==="
        find prebuilt/macos/arm64/include -type f -name "*.h" | head -20
    
    - name: Create release archive
      run: |
        cd prebuilt/macos/arm64
        zip -ry ../../../gamelibs-macos-arm64.zip *
        cd ../../..
        echo "Archive created: $(ls -lh gamelibs-macos-arm64.zip)"
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: gamelibs-macos-arm64
        path: gamelibs-macos-arm64.zip
        retention-days: 7

  build-lua-bindings:
    runs-on: ubuntu-22.04
    name: Build Lua FFI bindings (platform-independent)

    steps:
    - uses: actions/checkout@v4

    - name: Initialize cimgui submodule
      run: git submodule update --init --recursive cimgui

    - name: Install LuaJIT
      run: sudo apt-get update && sudo apt-get install -y luajit

    - name: Generate Lua bindings
      run: python3 build_imgui_bindings.py

    - name: Sanity-check coverage
      run: |
        # The dear_bindings overload-suffixed names that bit us before should
        # appear in cdef. Bare `igIsMouseDown` without the `_Nil` partner is
        # the 1.88-era smell we're guarding against.
        grep -q "igIsMouseDown_Nil" prebuilt/lua/cimgui/cdef.lua
        grep -q "igIsMouseDown_ID"  prebuilt/lua/cimgui/cdef.lua
        echo "cdef.lua line count: $(wc -l < prebuilt/lua/cimgui/cdef.lua)"
        echo "wrap.lua line count: $(wc -l < prebuilt/lua/cimgui/wrap.lua)"

    - name: Create release archive
      run: |
        cd prebuilt/lua
        zip -r ../../gamelibs-lua-bindings.zip cimgui
        cd ../..
        echo "Archive created: $(ls -lh gamelibs-lua-bindings.zip)"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: gamelibs-lua-bindings
        path: gamelibs-lua-bindings.zip
        retention-days: 7

  create-release:
    needs: [build-ubuntu, build-windows, build-macos, build-lua-bindings]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    name: Create Release
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download Linux artifact
      uses: actions/download-artifact@v4
      with:
        name: gamelibs-linux-x86_64
    
    - name: Download Windows artifact
      uses: actions/download-artifact@v4
      with:
        name: gamelibs-windows-x86_64
    
    - name: Download macOS artifact
      uses: actions/download-artifact@v4
      with:
        name: gamelibs-macos-arm64

    - name: Download Lua bindings artifact
      uses: actions/download-artifact@v4
      with:
        name: gamelibs-lua-bindings

    - name: Generate release notes
      run: |
        cat > release_notes.md << EOF
        ## Game Libraries Build ${{ github.ref_name }}
        
        **Date:** $(date -u +"%Y-%m-%d %H:%M UTC")
        
        ### Included Libraries
        - **SDL2** v2.32.4 - Cross-platform multimedia library
        - **FreeType** v2.14.1 - Font rendering library
        - **cimgui** - Dear ImGui C wrapper with SDL2/OpenGL3 backends
        - **LuaJIT** 2.1 - Just-In-Time Compiler for Lua
        - **SDL_image** v2.8.2 - Image loading (PNG, JPEG, WebP support)
        - **SDL_mixer** v2.8.0 - Audio mixing (WAV, OGG, MP3 support)
        - **SoLoud** 20200207 - Portable audio engine (ALSA/WinMM/CoreAudio backends)
        - **libmpv + FFmpeg** (mpv v0.40.0 / FFmpeg n7.1.1) - media playback +
          screen capture, self-built and version-consistent by construction
          on all three platforms (mac/linux dynamic shared; Windows mingw
          shared via MSYS2). No third-party prebuilts.
        
        ### Platform Builds
        - **Linux x86_64** (\`gamelibs-linux-x86_64.zip\`)
          - SDL2: ALSA, PulseAudio, X11, Wayland, OpenGL, OpenGLES, Vulkan support
          - Shared libraries (.so) and static libraries (.a)
        
        - **Windows x86_64** (\`gamelibs-windows-x86_64.zip\`)
          - SDL2: DirectX, OpenGL, Vulkan support
          - Dynamic libraries (.dll) and import libraries (.lib)
        
        - **macOS ARM64** (\`gamelibs-macos-arm64.zip\`) - Apple Silicon native
          - SDL2: Metal, OpenGL, Vulkan support
          - Dynamic libraries (.dylib) and static libraries (.a)

        - **Lua FFI bindings** (\`gamelibs-lua-bindings.zip\`) - platform-independent
          - LuaJIT FFI bindings for cimgui, generated by cimgui-love against
            the cimgui submodule revision used to build the dylibs above.
            Pair with any platform's dylib — bindings + dylib are guaranteed
            in lockstep because both derive from the same cimgui SHA.

        ### Installation
        1. Download the archive for your platform
        2. Extract to your preferred location
        3. The structure includes:
           - \`lib/\` - Compiled libraries
           - \`bin/\` - Runtime binaries (Windows: DLLs)
           - \`include/\` - Header files
           - \`lib/pkgconfig/\` - pkg-config files (Linux/macOS)
        
        ### Usage
        Set your build system to use:
        - Include path: \`<extracted_path>/include\`
        - Library path: \`<extracted_path>/lib\`
        - Runtime path (Windows): \`<extracted_path>/bin\`
        
        ### Building from Source
        See the [GitHub repository](https://github.com/${{ github.repository }}) for build instructions.
        EOF
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        name: Game Libraries ${{ github.ref_name }}
        body_path: release_notes.md
        files: |
          gamelibs-linux-x86_64.zip
          gamelibs-windows-x86_64.zip
          gamelibs-macos-arm64.zip
          gamelibs-lua-bindings.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}